openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Akiba - Chama management platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chamas
    description: Chama group operations
  - name: members
    description: Member operations
  - name: contributions
    description: Contribution operations
  - name: loans
    description: Loan operations
  - name: mpesa
    description: M-Pesa payment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chamas:
    get:
      operationId: listChamas
      tags: [chamas]
      summary: List all chamas
      responses:
        "200":
          description: List of chamas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chama"
    post:
      operationId: createChama
      tags: [chamas]
      summary: Create a new chama
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChamaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chama"

  /chamas/{id}:
    get:
      operationId: getChama
      tags: [chamas]
      summary: Get a chama by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chama details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chama"
        "404":
          description: Not found
    patch:
      operationId: updateChama
      tags: [chamas]
      summary: Update a chama
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChamaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chama"
        "404":
          description: Not found
    delete:
      operationId: deleteChama
      tags: [chamas]
      summary: Delete a chama
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /chamas/{id}/summary:
    get:
      operationId: getChamaSummary
      tags: [chamas]
      summary: Get financial summary for a chama
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chama financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChamaSummary"
        "404":
          description: Not found

  /chamas/{chamaId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members of a chama
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: addMember
      tags: [members]
      summary: Add a member to a chama
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /chamas/{chamaId}/members/{memberId}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member from a chama
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found

  /chamas/{chamaId}/contributions:
    get:
      operationId: listContributions
      tags: [contributions]
      summary: List contributions for a chama
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contribution"
    post:
      operationId: recordContribution
      tags: [contributions]
      summary: Record a contribution manually
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"

  /chamas/{chamaId}/loans:
    get:
      operationId: listLoans
      tags: [loans]
      summary: List loans for a chama
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
    post:
      operationId: createLoan
      tags: [loans]
      summary: Create a loan for a member
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /chamas/{chamaId}/loans/{loanId}:
    get:
      operationId: getLoan
      tags: [loans]
      summary: Get a loan
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Loan details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          description: Not found
    patch:
      operationId: updateLoan
      tags: [loans]
      summary: Update loan status or details
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          description: Not found

  /chamas/{chamaId}/loans/{loanId}/repayments:
    get:
      operationId: listRepayments
      tags: [loans]
      summary: List repayments for a loan
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of repayments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repayment"
    post:
      operationId: recordRepayment
      tags: [loans]
      summary: Record a loan repayment
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repayment"

  /chamas/{chamaId}/loans/{loanId}/repayment-plan:
    get:
      operationId: listRepaymentPlan
      tags: [loans]
      summary: List repayment plan entries for a loan
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of plan entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepaymentPlanEntry"
    post:
      operationId: addRepaymentPlanEntry
      tags: [loans]
      summary: Add a planned installment to a loan repayment plan
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentPlanEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentPlanEntry"

  /chamas/{chamaId}/loans/{loanId}/repayment-plan/{planId}:
    patch:
      operationId: updateRepaymentPlanEntry
      tags: [loans]
      summary: Update a repayment plan entry status
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepaymentPlanEntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentPlanEntry"

  /chamas/{chamaId}/invitations:
    post:
      operationId: createInvitation
      tags: [members]
      summary: Generate an invite link for a chama
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"

  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [members]
      summary: Get public info for an invite link
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPublic"
        "404":
          description: Not found or expired

  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [members]
      summary: Accept an invite and join the chama as a member
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptInput"
      responses:
        "201":
          description: Joined successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid or expired token

  /chamas/{chamaId}/transactions:
    get:
      operationId: listMpesaTransactions
      tags: [mpesa]
      summary: List M-Pesa transaction history for a chama
      parameters:
        - name: chamaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of M-Pesa transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MpesaTransaction"

  /mpesa/stkpush:
    post:
      operationId: initiateMpesaPayment
      tags: [mpesa]
      summary: Initiate M-Pesa STK Push payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaPaymentInput"
      responses:
        "200":
          description: STK Push initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpesaPaymentResult"
        "400":
          description: Bad request

  /mpesa/callback:
    post:
      operationId: mpesaCallback
      tags: [mpesa]
      summary: M-Pesa STK Push callback (Safaricom webhook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallbackPayload"
      responses:
        "200":
          description: Acknowledged

  /mpesa/disburse:
    post:
      operationId: disburseB2cPayout
      tags: [mpesa]
      summary: Disburse B2C payout to a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/B2cDisburseInput"
      responses:
        "200":
          description: B2C payout queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2cDisburseResult"
        "400":
          description: Bad request

  /mpesa/webhooks/b2c-result:
    post:
      operationId: b2cResultCallback
      tags: [mpesa]
      summary: B2C payout result callback (Safaricom webhook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DarajaWebhookPayload"
      responses:
        "200":
          description: Acknowledged

  /mpesa/webhooks/b2c-timeout:
    post:
      operationId: b2cTimeoutCallback
      tags: [mpesa]
      summary: B2C payout timeout callback (Safaricom webhook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DarajaWebhookPayload"
      responses:
        "200":
          description: Acknowledged

  /mpesa/reconcile:
    post:
      operationId: reconcilePendingTransactions
      tags: [mpesa]
      summary: Expire stale pending transactions older than 5 minutes
      responses:
        "200":
          description: Reconciliation result
          content:
            application/json:
              schema:
                type: object
                required: [expiredCount]
                properties:
                  expiredCount:
                    type: integer

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Chama:
      type: object
      required: [id, name, meetingFrequency, contributionAmount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        meetingFrequency:
          type: string
          enum: [weekly, monthly, quarterly]
        contributionAmount:
          type: number
        bankAccount:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChamaInput:
      type: object
      required: [name, meetingFrequency, contributionAmount]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        meetingFrequency:
          type: string
          enum: [weekly, monthly, quarterly]
        contributionAmount:
          type: number
          minimum: 1
        bankAccount:
          type: string

    ChamaUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        meetingFrequency:
          type: string
          enum: [weekly, monthly, quarterly]
        contributionAmount:
          type: number
          minimum: 1
        bankAccount:
          type: string

    ChamaSummary:
      type: object
      required: [chamaId, totalSavings, totalLoaned, totalRepaid, activeLoanCount, memberCount, recentContributions]
      properties:
        chamaId:
          type: integer
        totalSavings:
          type: number
        totalLoaned:
          type: number
        totalRepaid:
          type: number
        activeLoanCount:
          type: integer
        memberCount:
          type: integer
        recentContributions:
          type: array
          items:
            $ref: "#/components/schemas/Contribution"

    Member:
      type: object
      required: [id, chamaId, name, phoneNumber, role, joinedAt]
      properties:
        id:
          type: integer
        chamaId:
          type: integer
        name:
          type: string
        phoneNumber:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [chairperson, treasurer, secretary, member]
        joinedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    MemberInput:
      type: object
      required: [name, phoneNumber, role]
      properties:
        name:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
        email:
          type: string
        role:
          type: string
          enum: [chairperson, treasurer, secretary, member]

    MemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phoneNumber:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [chairperson, treasurer, secretary, member]

    Contribution:
      type: object
      required: [id, chamaId, memberId, memberName, amount, status, paidAt, createdAt]
      properties:
        id:
          type: integer
        chamaId:
          type: integer
        memberId:
          type: integer
        memberName:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [pending, completed, failed]
        mpesaRef:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ContributionInput:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: integer
        amount:
          type: number
          minimum: 1
        mpesaRef:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]

    Loan:
      type: object
      required: [id, chamaId, memberId, memberName, principal, interestRate, status, disbursedAt, dueDate, createdAt]
      properties:
        id:
          type: integer
        chamaId:
          type: integer
        memberId:
          type: integer
        memberName:
          type: string
        principal:
          type: number
        interestRate:
          type: number
        totalDue:
          type: number
        totalRepaid:
          type: number
        status:
          type: string
          enum: [pending, active, repaid, defaulted]
        disbursedAt:
          type: ["string", "null"]
          format: date-time
        dueDate:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    LoanInput:
      type: object
      required: [memberId, principal, interestRate, dueDate]
      properties:
        memberId:
          type: integer
        principal:
          type: number
          minimum: 1
        interestRate:
          type: number
          minimum: 0
        dueDate:
          type: string
          format: date
        notes:
          type: string

    LoanUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, active, repaid, defaulted]
        disbursedAt:
          type: string
          format: date-time
        notes:
          type: string

    Repayment:
      type: object
      required: [id, loanId, chamaId, memberId, amount, paidAt, createdAt]
      properties:
        id:
          type: integer
        loanId:
          type: integer
        chamaId:
          type: integer
        memberId:
          type: integer
        amount:
          type: number
        mpesaRef:
          type: ["string", "null"]
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    RepaymentInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1
        mpesaRef:
          type: string

    RepaymentPlanEntry:
      type: object
      required: [id, loanId, chamaId, plannedDate, plannedAmount, status, createdAt]
      properties:
        id:
          type: integer
        loanId:
          type: integer
        chamaId:
          type: integer
        plannedDate:
          type: string
          format: date
        plannedAmount:
          type: number
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [planned, paid, skipped]
        createdAt:
          type: string
          format: date-time

    RepaymentPlanEntryInput:
      type: object
      required: [plannedDate, plannedAmount]
      properties:
        plannedDate:
          type: string
          format: date
        plannedAmount:
          type: number
          minimum: 1
        notes:
          type: string

    RepaymentPlanEntryUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [planned, paid, skipped]
        notes:
          type: string

    Invitation:
      type: object
      required: [id, chamaId, token, maxUses, useCount, expiresAt, createdAt]
      properties:
        id:
          type: integer
        chamaId:
          type: integer
        token:
          type: string
        maxUses:
          type: integer
        useCount:
          type: integer
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    InvitationPublic:
      type: object
      required: [chamaId, chamaName, contributionAmount, meetingFrequency, memberCount, expiresAt, isExpired]
      properties:
        chamaId:
          type: integer
        chamaName:
          type: string
        chamaDescription:
          type: ["string", "null"]
        contributionAmount:
          type: number
        meetingFrequency:
          type: string
          enum: [weekly, monthly, quarterly]
        memberCount:
          type: integer
        expiresAt:
          type: string
          format: date-time
        isExpired:
          type: boolean

    InvitationAcceptInput:
      type: object
      required: [name, phoneNumber]
      properties:
        name:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
        email:
          type: string
        role:
          type: string
          enum: [chairperson, treasurer, secretary, member]

    MpesaPaymentInput:
      type: object
      required: [phoneNumber, amount, accountReference, transactionDesc]
      properties:
        phoneNumber:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 1
        accountReference:
          type: string
          minLength: 1
