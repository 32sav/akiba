kind = "web"
previewPath = "/"
title = "Akiba"
version = "1.0.0"
id = "artifacts/akiba"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20668

[services.development]
run = "pnpm --filter @workspace/akiba run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/akiba", "run", "build" ]
publicDir = "artifacts/akiba/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20668"
BASE_PATH = "/"
